{% extends 'store/base.html' %}

{% block title %}Password changed - Electro{% endblock %}

{% block content %}

<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Password changed</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
        <li class="breadcrumb-item active text-white">Password changed</li>
    </ol>
</div>

<div class="container-fluid py-5">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 text-center">
                <p class="mb-4">Your password has been changed. You can now log in with your new password.</p>
                <a href="{% url 'login' %}" class="btn btn-primary rounded-pill py-2 px-4">Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
