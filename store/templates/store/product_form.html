{% extends 'store/base.html' %}

{% block title %}{{ title }} - Electro{% endblock %}

{% block content %}

<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">{{ title }}</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
        <li class="breadcrumb-item active text-white">{{ title }}</li>
    </ol>
</div>

<div class="container-fluid py-5">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                        <div class="text-danger">{{ error }}</div>
                        {% endfor %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary rounded-pill py-2 px-4 me-2">Save</button>
                    <a href="{% url 'shop' %}" class="btn btn-outline-primary rounded-pill py-2 px-4">Cancel</a>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
