<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
</head>
<body>

    <h1>
        {{ product.name }}
        {% if product.is_on_sale %}
            <strong style="color: red;">SALE</strong>
        {% endif %}
    </h1>

    <p>
        კატეგორია:
        <a href="{% url 'category_detail' product.category.id %}">{{ product.category.name }}</a>
    </p>

    <p><strong>ფასი: {{ product.price }} ₾</strong></p>

    <p>{{ product.description }}</p>

    <p><a href="{% url 'home' %}">← უკან მთავარ გვერდზე</a></p>

</body>
</html>
