{% load static %}
<div class="product">
    <div class="product-item rounded">
        <div class="product-item-inner border rounded">
            <div class="product-item-inner-item">
                <img src="{% static 'store/img/product-3.png' %}" class="img-fluid w-100 rounded-top" alt="{{ product.name }}">
                {% if product.is_on_sale %}
                <div class="product-sale">Sale</div>
                {% endif %}
                <div class="product-details">
                    <a href="{% url 'product_detail' product.id %}"><i class="fa fa-eye fa-1x"></i></a>
                </div>
            </div>
            <div class="text-center rounded-bottom p-4">
                <a href="{% url 'category_detail' product.category.id %}" class="d-block mb-2">{{ product.category.name }}</a>
                <a href="{% url 'product_detail' product.id %}" class="d-block h4">{{ product.name }}</a>
                <span class="text-primary fs-5">{{ product.price }} ₾</span>
            </div>
        </div>
        <div class="product-item-add border border-top-0 rounded-bottom text-center p-4 pt-0">
            <a href="#" class="btn btn-primary border-secondary rounded-pill py-2 px-4 mb-4">
                <i class="fas fa-shopping-cart me-2"></i> Add To Cart
            </a>
        </div>
    </div>
</div>
